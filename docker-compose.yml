services:
  cop:
    build: .
    image: aegis-mesh:0.2
    ports:
      - "8000:8000"
    environment:
      AEGIS_TRACKER: gmphd
      AEGIS_REQUIRE_HUMAN: "false"
      AEGIS_LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz').status==200 else 1)"]
      interval: 20s
      timeout: 4s
      retries: 4
    restart: unless-stopped
