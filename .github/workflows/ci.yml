name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Tests (regression metrics gated here)
        run: pytest -q
      - name: Smoke — Threat Library end-to-end
        run: aegis-sim coordinated_formation
      - name: Smoke — resilience (sensor node loss)
        run: aegis-sim coordinated_formation --kill-site radar-N@12
      - name: Smoke — offline COP render
        run: aegis-render coordinated_formation --no-gif
      - name: Smoke — replay export (drives the Vercel dashboard)
        run: aegis-export --scenario coordinated_formation
      - name: Smoke — server health/metrics import
        run: python -c "from aegis_mesh.server.app import app; print('ok')"
