[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fcm"
version = "0.1.0"
description = "Factor Capacity & Crowding Monitor"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Nirbhai Verma" }]
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "plotly>=5.18",
    "rich>=13.7",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.30"]
opt = ["cvxpy>=1.4"]
data = ["yfinance>=0.2.40", "requests>=2.31"]
dev = ["pytest>=7.4", "pytest-cov", "ruff>=0.1.9", "ipykernel"]

[project.scripts]
fcm-demo = "fcm.scripts.run_demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
