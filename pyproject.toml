[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-mesh"
version = "0.0.1"
description = "Counter-swarm defense — autonomy + data OS (reference Phase 0/1 slice)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
serve = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "websockets"]
viz = ["matplotlib>=3.8", "pillow>=10"]
dev = ["pytest>=7.4", "pytest-cov", "ruff>=0.1.9",
       "fastapi>=0.110", "uvicorn[standard]>=0.27", "websockets",
       "matplotlib>=3.8", "pillow>=10"]

[project.scripts]
aegis-sim = "aegis_mesh.cli:main"
aegis-serve = "aegis_mesh.server.app:main"
aegis-render = "aegis_mesh.viz.render:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E702: terse multi-statement lines are idiomatic in the numeric kernels
ignore = ["E702"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
